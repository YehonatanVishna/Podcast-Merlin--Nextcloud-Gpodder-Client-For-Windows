name: Build Windows MSIX Installer

on:
  push:
    branches: [ feature/flutter-rewrite, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: podcast_merlin_flutter

      - name: Build Windows Release Binary
        run: flutter build windows --release
        working-directory: podcast_merlin_flutter

      - name: Package Windows MSIX
        run: dart run msix:create
        working-directory: podcast_merlin_flutter

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Podcast-Merlin-Windows-MSIX
          path: podcast_merlin_flutter/build/windows/x64/runner/Release/*.msix
